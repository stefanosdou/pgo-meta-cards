# Hourly: read the store, classify, render missing cards, advance the rollout, rebuild the supplementary feed.
# No secrets are needed: the store API is public and Meta reads the CSV from GitHub Pages.
#
# GitHub's cron skips runs, so the workflow also restarts itself: after each build a second job waits
# about 55 minutes and starts the next run. The cron stays as a watchdog that revives the chain if it stops.
#
# Two runs can start in the same minute (cron plus chain). Builds run one at a time, and each one checks out
# the newest main when it starts, not the commit that existed when it was queued. If publishing still fails
# (another push in between, or a server error), the build is repeated on top of the newest main.
name: feed
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: feed-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pillow>=11,<14"
      - run: python code/fetch.py
      - run: python code/classify.py
      - run: python code/build.py
      - name: Commit cards and feed
        run: |
          git config user.name "cards-bot"
          git config user.email "cards-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add cards feed data/classified.json data/coverage.json supp_count.txt supp_last_step.txt
            if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
            git commit -q -m "cards: hourly build"
            for try in 1 2 3; do
              if ! git pull --rebase; then break; fi
              if git push; then exit 0; fi
              sleep 30
            done
            echo "publish failed (attempt $attempt), rebuilding on the newest main"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python code/classify.py
            python code/build.py
          done
          echo "could not publish after 3 attempts"
          exit 1
  again:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Keep one chain alive
        run: |
          # other chain runs that are still alive (a manual start also begins a chain)
          alive() {
            gh run list --repo "${{ github.repository }}" --workflow feed.yml --event workflow_dispatch --json status,databaseId \
              --jq '[.[] | select(.status != "completed" and .databaseId != ${{ github.run_id }})] | length'
          }
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(alive)" != "0" ]; then echo "chain is alive, nothing to do"; exit 0; fi
          sleep 3300
          # checked again after the wait, so two chains merge back into one
          if [ "$(alive)" != "0" ]; then echo "another chain run is alive, it continues"; exit 0; fi
          gh workflow run feed.yml --repo "${{ github.repository }}" --ref main
